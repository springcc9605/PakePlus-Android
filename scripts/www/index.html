<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F2EA">
<title>南京亲子五日游</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* =====================================================================
   南京亲子五日游 · 手机端
   设计骨架：Swiss Minimalism（密排 + 网格 + 高对比）
   配色方向：road-trip warm（暖橙 + 地图青）
   图标：Phosphor 风格内联 SVG（不用 emoji 当 UI 图标）
   ===================================================================== */
:root{
  --paper:#F6F2EA; --card:#FFFDF9;
  --ink:#2B2622; --ink-2:#5B5249; --muted:#7A726A;
  --line:#E7DFD2; --line-2:#F0EADD;
  --maple:#C2452D; --on-maple:#fff; --gold:#D98B2B; --pine:#4E7A5A;
  /* 5 天站点色 */
  --d0:#3F7F96; --d1:#5F8F4A; --d2:#C58A1F; --d3:#C2452D; --d4:#6F63A0;

  --r-card:16px; --r-row:10px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --tap:48px; --tab-h:58px;
  --sh-card:0 2px 8px rgba(60,45,30,.08);
  --sh-drag:0 12px 32px rgba(60,45,30,.18);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:#e9e3d8;color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--maple);outline-offset:2px;border-radius:6px}
svg{display:block}
.ic{width:22px;height:22px;flex:0 0 auto}

/* ---------- 外壳 ---------- */
#app{
  position:relative;max-width:480px;margin:0 auto;background:var(--paper);
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 40px rgba(60,45,30,.14);
}

/* ---------- 状态条 ---------- */
#statusBar{
  flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,#43301F,#7A3A24 55%,#A8452A);
  color:#FFF8F0;
}
#statusBar .sb-t{font-size:16px;font-weight:700;letter-spacing:.01em}
#statusBar .sb-s{font-size:12px;opacity:.82;margin-top:2px}
#statusBar .sb-right{margin-left:auto;text-align:right;flex:0 0 auto}
#statusBar .sb-n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#statusBar .sb-l{font-size:11px;opacity:.78}
#statusBar .sb-bar{height:3px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:6px;overflow:hidden}
#statusBar .sb-bar>i{display:block;height:100%;width:0;background:#FFC888;border-radius:99px;transition:width .25s}
#statusBar button{color:inherit}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;display:none}
.panel.on{display:block}
.panel.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:12px 14px calc(20px + env(safe-area-inset-bottom));}

/* ---------- 卡片舞台 ---------- */
#p-trip{display:none;flex-direction:column}
#p-trip.on{display:flex}
#deckWrap{flex:1 1 auto;position:relative;overflow:hidden;padding:0}
.card{
  position:absolute;left:0;right:0;top:0;bottom:0;
  margin:16px 18px 0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-card);box-shadow:var(--sh-card);
  display:flex;flex-direction:column;overflow:hidden;
  transform-origin:50% 88%;will-change:transform,opacity;
  touch-action:pan-y;
}
.card:not(.active){pointer-events:none}
.card.active{pointer-events:auto}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}

.card-head{flex:0 0 auto;padding:14px 16px 10px;border-bottom:1px solid var(--line-2);position:relative}
.ch-top{display:flex;align-items:flex-start;gap:8px}
.ch-no{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--c)}
.ch-date{font-size:26px;font-weight:700;line-height:1.15;margin-top:2px;letter-spacing:-.01em}
.ch-date small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.ch-theme{font-size:13px;color:var(--ink-2);margin-top:4px}
.ch-prog{flex:0 0 auto;text-align:right;margin-left:auto}
.ch-prog b{font-size:20px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.ch-prog span{display:block;font-size:11px;color:var(--muted)}
.rain-btn{
  display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;margin-left:auto;
  border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--muted);background:#FCFAF5;
}
.rain-btn[aria-pressed="true"]{background:#EEF3F6;border-color:#B9CDD8;color:#2F5C72;font-weight:600}
.rain-note{
  margin-top:10px;display:flex;gap:8px;align-items:flex-start;
  background:#FDF8EC;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;
  padding:8px 10px;font-size:12.5px;color:#7A5D1E;
}
.rain-note b{color:#6B4E12}

.card-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:6px 10px 14px}

/* 时间轴行 */
.row{
  position:relative;display:flex;align-items:flex-start;gap:10px;
  min-height:var(--tap);padding:9px 6px;border-radius:var(--r-row);
}
.row+.row{border-top:1px dashed var(--line-2)}
.row .hit{position:absolute;inset:0;border-radius:var(--r-row);z-index:1;cursor:pointer}
.row .hit:active{background:#FAF6EE}
.row .tick,.row .r-main{position:relative;z-index:0}
.row-guide{
  position:relative;z-index:2;flex:0 0 auto;align-self:center;
  height:34px;padding:0 11px;border-radius:999px;border:1px solid #E4CFC6;
  background:#FCF7F4;color:var(--maple);font-size:12.5px;font-weight:700;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
}
.row-guide:active{background:#F6E9E4}
.row-guide .ic{width:15px;height:15px}
.row .tick{
  flex:0 0 auto;width:22px;height:22px;margin-top:3px;border:2px solid #D3C9BA;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s,border-color .15s;
}
.row .tick svg{width:14px;height:14px;opacity:0;transition:opacity .15s}
.row input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.row.done .tick{background:var(--c);border-color:var(--c)}
.row.done .tick svg{opacity:1}
.row .r-main{flex:1 1 auto;min-width:0}
.row .r-line{display:flex;align-items:baseline;gap:8px}
.row .r-time{
  flex:0 0 auto;font-size:14px;font-weight:700;color:#8A5A2B;font-variant-numeric:tabular-nums;
  min-width:44px;
}
.row .r-name{font-size:16px;font-weight:600;line-height:1.45;word-break:break-word}
.row.done .r-name,.row.rain-out .r-name{color:#A9A199}
.row.done .r-name{text-decoration:line-through;text-decoration-color:#CFC7BC}
.row .r-meta{display:block;margin-top:3px;font-size:13px;color:var(--ink-2);line-height:1.5}
.row .r-tip b{color:#4A3B2C}
.row .r-tr{color:var(--muted);font-size:12px}
.row .dotsep{color:#CFC7BC;margin:0 5px;font-size:12px}
.row .r-alt{
  display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 9px;border-radius:999px;
  background:#EEF3F6;color:#2F5C72;font-size:12px;font-weight:600;
}
.row.rain-out .r-name,.row.rain-out .r-meta,.row.rain-out .r-time,.row.rain-out .tick{opacity:.42}
.row.rain-out .r-alt{opacity:1}

/* 卡内其它块 */
.blk{margin:10px 6px 0;padding-top:12px;border-top:1px solid var(--line-2)}
.blk h4{font-size:13px;color:var(--ink-2);margin:0 0 8px;font-weight:700;letter-spacing:.02em}
.routemap{
  display:block;width:100%;padding:0;text-align:left;position:relative;
  border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#F7F3EA;
}
.routemap>svg{width:100%;height:auto}
.routemap .ic{width:18px;height:18px}
.routemap .rm-open{
  position:absolute;right:8px;bottom:8px;height:32px;padding:0 11px;border-radius:999px;
  background:rgba(255,253,249,.94);border:1px solid var(--line);font-size:12px;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:5px;
}
.routemap:active .rm-open{background:#F1EAE2}
.note{font-size:13px;color:var(--ink-2);background:#FAF7F1;border-radius:10px;padding:10px 12px;line-height:1.6}
div.note+div.note{margin-top:8px}
.note.warn{background:#FDF1EE;color:#8D3A24}
.note.rain{background:#FDF8EC;color:#7A5D1E;border-left:3px solid var(--gold);border-radius:0 10px 10px 0}
.note.cut{background:#FDF6F2;color:#8D3A24;border-left:3px solid #E3C3B6;border-radius:0 10px 10px 0}
.note b{color:inherit}
.note ul{margin:4px 0 0;padding-left:18px}
.tagbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;background:#F1ECE3;color:#5D554C;font-size:11.5px;white-space:nowrap}
.tag.warn{background:#FDEEE9;color:#A63A22}
.tag.note{background:#EEF3EC;color:#41683F}
.tag.cut{background:#FBF1DD;color:#8A6512}
.tag.lvl{background:#EFE9DE;color:#5D554C}
.tag.lvl.light{background:#EEF3EC;color:#41683F}
.tag.lvl.mid{background:#FBF1DD;color:#8A6512}
.tag.lvl.heavy{background:#FDEEE9;color:#A63A22}

/* 当前时段高亮 / 关键时间 */
.row.now{background:#FDF8EC;box-shadow:inset 3px 0 0 var(--gold)}
.row.now .r-time{color:#8A5A2B}
.r-time.key{color:var(--maple);font-weight:800}
.r-time.key::before{content:"◉";font-size:9px;vertical-align:2px;margin-right:2px}

/* 下午空档 三选一 */
.pick{display:flex;flex-direction:column;gap:8px}
.pick-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#FCFAF5;width:100%}
.pick-btn .pk-t{font-size:15px;font-weight:700}
.pick-btn small{font-size:12.5px;color:var(--muted);font-weight:400}
.pick-btn[aria-checked="true"]{background:#FDF1EE;border-color:#E3C3B6;box-shadow:inset 3px 0 0 var(--maple)}
.pick-btn[aria-checked="true"] .pk-t{color:var(--maple)}

/* 回到今天 */
.back-today{position:absolute;right:18px;bottom:66px;z-index:5;height:36px;padding:0 15px;
  border-radius:999px;background:var(--maple);color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 4px 14px rgba(60,45,30,.28)}
.back-today:active{background:#A93A24}

/* 回到顶部 */
.pg-top{position:absolute;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;
  height:38px;padding:0 14px;border-radius:999px;background:rgba(255,253,249,.96);
  border:1px solid var(--line);color:var(--ink-2);font-size:13px;box-shadow:var(--sh-card)}
.pg-top:active{background:#F1EAE2}
.card-act{display:flex;gap:8px;margin-top:14px}
.card-act .btn{flex:1 1 0}

/* ---------- 卡堆导航 ---------- */
#deckNav{
  flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;
  padding-bottom:2px;
}
.nav-btn{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid var(--line);background:var(--card);
}
.nav-btn:disabled{opacity:.3}
.nav-btn:active:not(:disabled){background:#F3EEE4}
#dots{display:flex;align-items:center}
.dot{
  width:26px;height:34px;display:flex;align-items:center;justify-content:center;
}
.dot i{display:block;width:7px;height:7px;border-radius:99px;background:#D3C9BA;transition:all .25s var(--ease)}
.dot[aria-current="true"] i{width:20px;background:var(--maple)}
.dot:active i{background:#B8AD9E}

/* ---------- 通用按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:var(--tap);padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:14.5px;color:var(--ink);
}
.btn:active{background:#F3EEE4}
.btn.primary{background:var(--maple);border-color:var(--maple);color:#fff}
.btn.primary:active{background:#A93A24}
.btn.sm{min-height:38px;font-size:13px;padding:0 11px;border-radius:10px}

/* ---------- Tab 栏 ---------- */
#tabbar{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);background:#FFFCF6;
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{
  height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:#9C948A;font-size:11.5px;position:relative;
}
#tabbar button[aria-selected="true"]{color:var(--maple)}
#tabbar button[aria-selected="true"]::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--maple);
}
#tabbar .ic{width:23px;height:23px}
#tabbar .badge{
  position:absolute;top:6px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;
  border-radius:99px;background:var(--maple);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

/* ---------- 地图 Tab ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;
}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;font-weight:600}
#mapBox{height:min(58vh,440px);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#EAE4D8}
#mapHint{font-size:12px;color:var(--muted);margin:8px 2px 12px;line-height:1.5}
.poilist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.poi{
  display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:8px 12px;width:100%;text-align:left;
}
.poi+.poi{border-top:1px solid var(--line-2)}
.poi:active{background:#FAF6EE}
.poi .n{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.poi .t{flex:1 1 auto;font-size:15px}
.poi .t small{display:block;font-size:12px;color:var(--muted);margin-top:1px}

/* ---------- 清单 Tab ---------- */
.seg{display:flex;gap:4px;background:#EFE9DE;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{
  flex:1 1 0;height:38px;border-radius:9px;font-size:13.5px;color:var(--ink-2);
}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--sh-card)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sec>h3{font-size:15px;margin:0 0 4px}
.sec .desc{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.sub-h{font-size:13px;font-weight:700;color:var(--ink-2);margin:14px 0 4px}
.sub-h:first-child{margin-top:2px}
.ck{
  display:flex;align-items:flex-start;gap:10px;min-height:var(--tap);padding:10px 2px;cursor:pointer;
}
.ck+.ck{border-top:1px dashed var(--line-2)}
.ck .box{
  flex:0 0 auto;width:22px;height:22px;margin-top:2px;border:2px solid #D3C9BA;border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s,border-color .15s;
}
.ck .box svg{width:14px;height:14px;opacity:0}
.ck input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.ck.on .box{background:var(--pine);border-color:var(--pine)}
.ck.on .box svg{opacity:1}
.ck .tx{flex:1 1 auto;font-size:15px;line-height:1.5}
.ck.on .tx{color:#A9A199}
.ck .tx small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
td{padding:9px 8px 9px 0;border-bottom:1px dashed var(--line-2);vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:0}
td b{color:#4A3B2C}
.pbar{height:6px;border-radius:99px;background:#EFE9DE;overflow:hidden;margin:2px 0 12px}
.pbar>i{display:block;height:100%;width:0;background:var(--pine);border-radius:99px;transition:width .25s}

/* ---------- 更多 Tab ---------- */
.mrow{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:12px 14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.mrow:active{background:#FAF6EE}
.mrow .mi{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:#F1ECE3;color:var(--maple);
  display:flex;align-items:center;justify-content:center}
.mrow .mt{flex:1 1 auto;font-size:15px;font-weight:600}
.mrow .mt small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
.mrow .mc{flex:0 0 auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px}

/* ---------- 底部抽屉 ---------- */
.sheet{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(43,38,34,.42)}
.sheet[hidden]{display:none}
.sheet .sd{
  background:var(--card);border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;
  margin:0 auto;width:100%;max-width:480px;animation:up .26s var(--ease);
}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet .sh{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .sh h3{font-size:16px;margin:0;flex:1 1 auto}
.sheet .sc{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 16px}
.sheet .sf{flex:0 0 auto;display:flex;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)}
.sheet .sf .btn{flex:1 1 0}
.x-close{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
#shareText{
  width:100%;height:46vh;border:1px solid var(--line);border-radius:12px;padding:12px;background:#FCFAF5;
  font:12.5px/1.6 ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace;resize:none;color:#3B342C;
}
#sheetMap{height:62vh;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#EAE4D8}
#sheetMapInner{height:62vh}
.leaflet-popup-content{font-size:13px;line-height:1.5;margin:8px 10px}
.leaflet-popup-content b{color:#A8452A}

/* ---------- 全屏页面（攻略 / 路线图） ---------- */
.page{
  position:fixed;inset:0;z-index:95;background:var(--paper);
  max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  animation:pgIn .22s var(--ease);
}
.page[hidden]{display:none}
@keyframes pgIn{from{transform:translateX(16px);opacity:.55}to{transform:none;opacity:1}}
.pg-head{
  flex:0 0 auto;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:#FFFCF6;border-bottom:1px solid var(--line);
}
.pg-back{
  width:42px;height:42px;flex:0 0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;

.pg-body{

  pk:  (g,i) => `pk|${g}|${i}`,

  cl:  i => `cl|${i}`,
  out: i => `tr-out|${i}`,
  back:i => `tr-back|${i}`,
  stayWhy: i => `stay-why|${i}`,
  stayAsk: i => `stay-ask|${i}`,
  pick: d => `pick|${d}`,
  rain: d => `rain|${d}`
};
let store = {};
function loadStore(){ try{ store = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ store = {}; } }
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }

function allKeys(){
  const k = [];
  DAYS.forEach(d => { d.rows.forEach((r,i) => k.push(K.row(d.id,i))); if (d.pick) k.push(K.pick(d.id)); });
  COUNTDOWN.forEach((r,i) => k.push(K.cd(i)));
  BOOKING.forEach((r,i) => k.push(K.bk(i)));
  PACKING.forEach((g,gi) => g.items.forEach((it,i) => k.push(K.pk(gi,i))));
  MUST_EAT.forEach((t,i) => k.push(K.me(i)));
  CLOTHES_CHECK.forEach((t,i) => k.push(K.cl(i)));
  TRAIN_OUT.forEach((r,i) => k.push(K.out(i)));
  TRAIN_BACK.forEach((r,i) => k.push(K.back(i)));
  STAY_WHY.forEach((t,i) => k.push(K.stayWhy(i)));
  STAY_ASK.forEach((t,i) => k.push(K.stayAsk(i)));
  return k;
}
const ALL_KEYS = allKeys();
function progress(){
  const done = ALL_KEYS.filter(k => store[k]).length;
  return { done, total: ALL_KEYS.length };
}
function paintProgress(){
  const p = progress();
  const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
  document.getElementById('sbNum').textContent = `${p.done}/${p.total}`;
  document.getElementById('sbBar').style.width = pct + '%';
  DAYS.forEach(d => {
    const el = document.querySelector(`[data-cprog="${d.id}"]`);
    if (!el) return;
    const n = d.rows.filter((r,i) => store[K.row(d.id,i)]).length;
    el.innerHTML = `<b>${n} / ${d.rows.length}</b><span>已完成</span>`;
  });
  const lb = document.querySelector('[data-pbar]');
  if (lb) {
    const on = listKeys().filter(k => store[k]).length;
    lb.style.width = (listKeys().length ? Math.round(on / listKeys().length * 100) : 0) + '%';
  }
  document.querySelectorAll('label.ck[data-k]').forEach(l => l.classList.toggle('on', !!store[l.dataset.k]));
  document.querySelectorAll('.row[data-k]').forEach(r => r.classList.toggle('done', !!store[r.dataset.k]));
  document.querySelectorAll('.pick-btn').forEach(b => {
    b.setAttribute('aria-pressed', String(store[K.pick(b.dataset.pick)] === b.dataset.pi));
  });
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[data-k]')) { store[el.dataset.k] = el.checked; saveStore(); paintProgress(); }
});

/* =====================================================================
   SVG 线路示意图
   ===================================================================== */
function schematic(routes, w, h, fs){
  fs = fs || 13;
  const entries = (routes||[]).map(r => ({
    color: r.color, name: r.name,
    pts: [...new Set(r.points)].map(n => ({ n, p: POI[n] })).filter(x => x.p)
  })).filter(r => r.pts.length);
  if (!entries.length) return '<div style="padding:18px;font-size:13px;color:#7A726A">无点位数据</div>';

  const all = entries.flatMap(r => r.pts);
  const lat = all.map(x => x.p[0]), lng = all.map(x => x.p[1]);
  let a = Math.min(...lat), b = Math.max(...lat), c = Math.min(...lng), e2 = Math.max(...lng);
  if (b - a < 1e-4) { a -= 5e-4; b += 5e-4; }
  if (e2 - c < 1e-4) { c -= 5e-4; e2 += 5e-4; }

  const single = entries.length === 1;
  const cols = 3;
  const legendRows = single ? 0 : Math.ceil(entries.length / cols);
  const cos = Math.cos((a + b) / 2 * Math.PI / 180);
  const spanX = (e2 - c) * cos, spanY = b - a;
  const pad = w * .055;
  const padR = single ? fs * 11.5 : w * .06;
  const padB = h * .13 + legendRows * fs * 1.5;
  const s = Math.min((w - pad - padR) / spanX, (h - pad - padB) / spanY);
  const offX = pad + ((w - pad - padR) - spanX * s) / 2;
  const offY = pad + ((h - pad - padB) - spanY * s) / 2;
  const XY = p => [offX + (p[1] - c) * cos * s, offY + (b - p[0]) * s];

  const placed = [];
  const body = entries.map(en => {
    const xy = en.pts.map(x => XY(x.p));
    const path = xy.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' ');
    const marks = xy.map((q, i) => {
      const dot = `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${(single?fs*.52:fs*.4).toFixed(1)}"
        fill="${single?'#FFFDF9':en.color}" stroke="${single?'#C2452D':'#FFFDF9'}" stroke-width="${single?fs*.22:fs*.11}"/>`;
      if (!single) return dot;
      const lx = q[0] + fs * .85;
      let ly = q[1] + fs * .32, g = 0;
      while (placed.some(p => Math.abs(p.x - lx) < fs * 15 && Math.abs(p.y - ly) < fs * 1.2) && g++ < 14) ly += fs * 1.2;
      ly = Math.max(fs * 1.1, Math.min(h - padB - fs * .4, ly));
      placed.push({ x: lx, y: ly });
      return dot
        + `<line x1="${(q[0] + fs * .32).toFixed(1)}" y1="${q[1].toFixed(1)}" x2="${lx.toFixed(1)}" y2="${(ly - fs * .3).toFixed(1)}" stroke="#C8BDAE" stroke-width="${(fs*.08).toFixed(2)}"/>`
        + `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="${fs}" font-family="system-ui,PingFang SC,Microsoft YaHei" fill="#3B342C" style="paint-order:stroke;stroke:#FFFDF9;stroke-width:${(fs*.28).toFixed(1)}px">${i+1} ${en.pts[i].n}</text>`;
    }).join('');
    return `<path d="${path}" fill="none" stroke="${en.color}" stroke-width="${(single?fs*.2:fs*.16).toFixed(2)}"
      stroke-dasharray="${single?'7 5':'5 5'}" stroke-linecap="round" opacity="${single?'.75':'.8'}"/>${marks}`;
  }).join('');

  const legend = single ? '' : entries.map((en, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const yy = h - fs * 1.2 - (legendRows - 1 - row) * fs * 1.5;
    return `<circle cx="${pad + col * (w / cols) - fs * 2}" cy="${(yy - fs * .3).toFixed(1)}" r="${(fs*.4).toFixed(1)}" fill="${en.color}"/>
      <text x="${(pad + col * (w / cols) - fs * .9).toFixed(1)}" y="${yy.toFixed(1)}" font-size="${(fs*.92).toFixed(1)}"
        font-family="system-ui,PingFang SC,Microsoft YaHei" fill="#6B6259">${en.name}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet"
    xmlns="http://www.w3.org/2000/svg" style="display:block" role="img" aria-label="当日线路示意图">
    <rect width="${w}" height="${h}" fill="#F7F3EA"/>${body}${legend}
    <text x="${(w*.02).toFixed(1)}" y="${h - fs*.25}" font-size="${(fs*.78).toFixed(1)}" font-family="system-ui" fill="#C0B8AD">线路示意图（非真实底图）</text>
  </svg>`;
}

  const t = new Date(); t.setHours(0,0,0,0);
  const s = new Date(TRIP_START + 'T00:00:00'), e = new Date(TRIP_END + 'T00:00:00');
  if (t < s) return 0;
  if (t > e) return DAYS.length - 1;
  const diff = Math.round((t - s) / 86400000);
  return Math.max(0, Math.min(DAYS.length - 1, diff));
}
function renderStatus(){
  const t = new Date(); t.setHours(0,0,0,0);
  const s = new Date(TRIP_START + 'T00:00:00'), e = new Date(TRIP_END + 'T00:00:00');
  const sub = document.getElementById('sbSub');
  if (t < s) {
    const n = Math.round((s - t) / 86400000);
    sub.textContent = `还有 ${n} 天出发 · 11/28–12/2`
      + (n <= 2 ? ' · 该收拾行李了' : '');
  } else if (t > e) {
    sub.textContent = '行程已完成 · 11/28–12/2';
  } else {
    sub.textContent = `今天是 ${DAYS[todayIndex()].no} · ${DAYS[todayIndex()].date}`;
  }
}

/* 当前时段高亮：行程当天按时间找当前行 */
function nowRowIndex(d){
  if (!inTrip() || DAYS[todayIndex()].id !== d.id) return -1;
  const n = new Date(), mins = n.getHours()*60 + n.getMinutes();
  let idx = -1;
  d.rows.forEach((r,i) => {
    const m = /(\d{1,2}):(\d{2})/.exec(r[0]);
    if (!m) return;
    if ((+m[1])*60 + (+m[2]) <= mins) idx = i;
  });
  return idx;
}
function markNow(){
  DAYS.forEach(d => {
    const idx = nowRowIndex(d);
    document.querySelectorAll(`[data-body="${d.id}"] .row`).forEach((el,i) => el.classList.toggle('now', i === idx));
  });
  syncBackToday();
}

/* 卡片布局：当前卡跟手并旋转；相邻卡从侧面探出 */
function layout(animate){
  const W = document.getElementById('deckWrap').clientWidth || 360;
  const PEEK = 20, S0 = 0.97, p = Math.min(1, Math.abs(dragFrac));
  const dir = dragFrac < 0 ? 1 : dragFrac > 0 ? -1 : 1;
  const incoming = active + dir;
  const t = animate ? 'transform .32s var(--ease), opacity .32s var(--ease)' : 'none';
  deckEls.forEach((el, i) => {
    el.style.transition = t;
    const rel = i - active;
    if (rel === 0) {
      el.className = 'card active';
      el.style.transform = `translate3d(${(dragFrac*W).toFixed(1)}px,0,0) rotate(${(dragFrac*6).toFixed(2)}deg)`;
      el.style.opacity = 1;
      el.style.zIndex = 3;
      el.style.boxShadow = Math.abs(dragFrac) > .02 ? 'var(--sh-drag)' : 'var(--sh-card)';
      el.style.pointerEvents = 'auto';
    } else if (i === incoming && Math.abs(rel) <= 1.2) {
      const x = dir * PEEK * (1 - p);
      el.className = 'card';
      el.style.transform = `translate3d(${x.toFixed(1)}px,0,0) scale(${(S0 + (1-S0)*p).toFixed(4)}) rotate(0deg)`;
      el.style.opacity = 1;
      el.style.zIndex = 2;
      el.style.pointerEvents = 'none';
    } else {
      el.className = 'card';
      el.style.transform = `translate3d(${(dir*PEEK).toFixed(1)}px,0,0) scale(${S0})`;
      el.style.opacity = 0;
      el.style.zIndex = 1;
      el.style.pointerEvents = 'none';
    }
  });
  document.querySelectorAll('[data-dot]').forEach(b =>
    b.setAttribute('aria-current', String(+b.dataset.dot === active)));
  document.getElementById('btnPrev').disabled = active === 0;
  document.getElementById('btnNext').disabled = active === DAYS.length - 1;
}
function goTo(i, animate){
  if (i < 0 || i >= DAYS.length || i === active) return;
  slideTo(i, animate);
}
/* 翻页动画：旧卡沿「拖动方向」滑出，新卡从侧后方升到正中 */
function slideTo(target, animate){
  const dir = target > active ? 1 : -1;
  if (!animate){ active = target; dragFrac = 0; layout(false); return; }
  animating = true;
  dragFrac = -dir;                             // 旧卡滑到 -dir * 屏宽
  layout(true);
  setTimeout(() => {
    animating = false; active = target; dragFrac = 0;
    layout(false); announce(); markNow(); scrollToNow();
  }, 330);
}

/* ---------- 手势 ---------- */
(function gesture(){
  const wrap = document.getElementById('deckWrap');
  let sx = 0, sy = 0, st = 0, axis = null, id = null;
  const W = () => wrap.clientWidth || 360;

  function down(x, y, t, target){
    if (animating) return;
    const r = wrap.getBoundingClientRect();
    if (x - r.left < 24) return;            // 左侧 24px 保护区：保住 iOS 左缘返回
    id = 1; sx = x; sy = y; st = t; axis = null; dragFrac = 0;
  }
  function move(x, y, t){
    if (!id || animating) return;
    const dx = x - sx, dy = y - sy;
    if (!axis){
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) axis = 'x';
      else if (Math.abs(dy) > 8) { axis = 'y'; id = null; return; }
      else return;
    }
    if (axis !== 'x') return;
    let f = dx / W();
    // 硬边：首尾橡皮筋
    if ((active === 0 && f > 0) || (active === DAYS.length-1 && f < 0)) f *= 0.35;
    dragFrac = Math.max(-1.1, Math.min(1.1, f));
    layout(false);
  }
  function up(t){
    if (!id || animating) return;
    const dur = st ? (t - st) : 999, v = Math.abs(dragFrac) * W() / Math.max(1, dur);
    const commit = Math.abs(dragFrac) > 0.28 || v > 0.5;
    const dir = dragFrac < 0 ? 1 : -1;        // 拖左 = 下一张
    id = null;
    const target = active + dir;
    if (commit && target >= 0 && target < DAYS.length){
      slideTo(target);
    } else {
      animating = true;
      dragFrac = 0;                            // 回弹
      layout(true);
      setTimeout(() => { animating = false; layout(false); }, 330);
    }
  }
  wrap.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    const t0 = e.touches[0]; down(t0.clientX, t0.clientY, e.timeStamp, e.target);
  }, { passive:true });
  wrap.addEventListener('touchmove', e => {
    if (!id) return;
    const t0 = e.touches[0]; move(t0.clientX, t0.clientY, e.timeStamp);
    if (axis === 'x') e.preventDefault();
  }, { passive:false });
  wrap.addEventListener('touchend', e => { if (id) up(e.timeStamp); });
  wrap.addEventListener('touchcancel', e => { if (id) up(e.timeStamp); });

  /* 桌面兜底（鼠标拖拽 + 键盘） */
  wrap.addEventListener('mousedown', e => { if (e.button === 0) down(e.clientX, e.clientY, e.timeStamp, e.target); });
  window.addEventListener('mousemove', e => { if (id) move(e.clientX, e.clientY, e.timeStamp); });
  window.addEventListener('mouseup', e => { if (id) up(e.timeStamp); });
  document.addEventListener('keydown', e => {
    if (document.querySelector('.sheet:not([hidden]), .page:not([hidden])')) return;
    if (e.key === 'ArrowLeft') goTo(active-1, true);
    if (e.key === 'ArrowRight') goTo(active+1, true);
  });
})();
function announce(){
  const d = DAYS[active];

function bindBodyEvents(){
  document.querySelectorAll('.row input[data-k]').forEach(inp => {
    inp.onchange = () => {
      store[inp.dataset.k] = inp.checked; saveStore();
      inp.closest('.row').classList.toggle('done', inp.checked);
      paintProgress();
    };
  });
  document.querySelectorAll('[data-rain]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.rain;
      const next = !store[K.rain(id)];
      store[K.rain(id)] = next; saveStore();
      refreshCard(id);
      toast(next ? '已切换到雨天版' : '已切回正常行程');
    };
  });
  document.querySelectorAll('[data-export]').forEach(b => { b.onclick = () => exportDay(b.dataset.export); });
  document.querySelectorAll('[data-textday]').forEach(b => { b.onclick = () => openText(b.dataset.textday); });
  document.querySelectorAll('.pick-btn').forEach(b => {
    b.onclick = () => {
      const k = K.pick(b.dataset.pick), i = b.dataset.pi;
      if (store[k] === i) delete store[k]; else store[k] = i;
      saveStore(); refreshCard(b.dataset.pick);
      toast(store[k] === i ? `下午空档已选：${DAYS.find(d=>d.id===b.dataset.pick).pick[+i].t}` : '下午空档已设为待定');
    };
  });
}

function gcj(p){

const TILE = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}';
function drawMap(){
  const d = DAYS.find(x => x.id === mapDay) || DAYS[0];

const scrollMem = {};
function setTab(name){
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['trip','map','list','more'].forEach(n => {
    const p = document.getElementById('p-' + n);
    if (n === name){ if (p.classList.contains('on')) return; p.classList.add('on'); }
    else if (p.classList.contains('on')) { scrollMem[n] = p.scrollTop; p.classList.remove('on'); }
  });
  const p = document.getElementById('p-' + name);
  if (name !== 'trip' && scrollMem[name] != null) requestAnimationFrame(() => { p.scrollTop = scrollMem[name]; });
  if (name === 'map') drawMap();
  if (name === 'list') renderList();
  if (name === 'more') renderMore();
}
document.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => setTab(b.dataset.tab); });
function show(id){ const s = document.getElementById(id); s.hidden = false; }
function hide(id){ const s = document.getElementById(id); s.hidden = true; }
document.querySelectorAll('[data-close]').forEach(b => {
  b.onclick = () => { hide('sheetText'); };
});
document.querySelectorAll('.sheet').forEach(s => {
  s.addEventListener('click', e => { if (e.target === s) hide(s.id); });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.querySelector('.page:not([hidden])')) { closePages(); return; }
  hide('sheetText');
});
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800);
}

  out.push(`完成进度：${p.done} / ${p.total}`);
  out.push('');
  (onlyDay ? [DAYS.find(d => d.id === onlyDay)] : DAYS).forEach(d => {
    out.push(`## ${d.no} · ${d.date} ${d.week} · ${d.weather} ${d.temp} · ${d.theme}`);
    out.push(`交通：${d.traffic}`);
    const rain = !!store[K.rain(d.id)];
    if (rain) out.push(`> ☔ 雨天版：${d.rainNote}`);
    d.rows.forEach((r,i) => {
      const segs = [r[0], r[1]];
      if (r[2] && r[2] !== '—') segs.push(`交通：${strip(r[2])}`);
      if (r[3] && r[3] !== '—') segs.push(strip(r[3]));
      out.push(ck(segs.join('｜'), K.row(d.id,i)));
      if (rain && r[4]) out.push(`      ↳ 雨天：${r[4]}`);
    });
    out.push(`- 可砍项：${d.cut}`);
    if (d.pick){
      const sel = store[K.pick(d.id)];
      out.push(`- 下午空档三选一：${sel!=null && d.pick[+sel] ? '已选 ' + d.pick[+sel].t : '待定'}（${d.pick.map(p=>p.t).join(' / ')}）`);
    }
    out.push('');
  });
  if (!onlyDay){
    out.push('## 行前倒计时');
    COUNTDOWN.forEach((r,i) => out.push(ck(`${r[0]}｜${r[1]}`, K.cd(i))));
    out.push('');
    out.push('## 交通与住宿');
    TRAIN_OUT.forEach((r,i) => out.push(ck(`去程 ${r[0]} ${r[1]}｜${r[2]}｜${r[3]}`, K.out(i))));
    TRAIN_BACK.forEach((r,i) => out.push(ck(`返程 ${r[0]} ${r[1]}｜${r[2]}`, K.back(i))));
    TIMELINE.forEach(g => out.push(`- ${g.t}：${g.s.map(s => s[0]+' '+s[1]).join(' → ')}`));
    STAY_WHY.forEach((t,i) => out.push(ck(strip(t), K.stayWhy(i))));
    STAY_ASK.forEach((t,i) => out.push(ck(strip(t), K.stayAsk(i))));
    out.push('');
    out.push('## 预约总表');
    BOOKING.forEach((r,i) => out.push(ck(`${r[0]}｜${r[1]}｜${r[2]}｜${r[3]}｜${strip(r[4])}`, K.bk(i))));
    out.push('');
    PACKING.forEach((g,gi) => {
      out.push(`## ${g.h}`);
      g.items.forEach((it,i) => out.push(ck(strip(it), K.pk(gi,i))));
      out.push('');
    });
    out.push('## 餐饮');
    EAT.forEach(r => out.push(`- ${r[0]}｜${r[1]}｜${r[2]}`));
    MUST_EAT.forEach((t,i) => out.push(ck(t, K.me(i))));
    out.push('');
    out.push('## 天气与穿衣');
    out.push('| 日期 | 天气 | 气温 | 天黑 |');
    out.push('|---|---|---|---|');
    WEATHER.forEach(r => out.push(`| ${r.join(' | ')} |`));
    LAYERS.forEach(t => out.push(`- ${strip(t)}`));
    CLOTHES_CHECK.forEach((t,i) => out.push(ck(t, K.cl(i))));
    out.push('');
    out.push('## 突发预案');
    PLANB.forEach(p => {
      out.push(`### ${p.h}`);
      if (p.n) out.push(`> ${strip(p.n)}`);
      (p.list||[]).forEach(t => out.push(`- ${strip(t)}`));
      (p.tb||[]).forEach(r => out.push(`- ${r[0]}：${strip(r[1])}`));
    });
    out.push('');
    out.push('## 预算');
    BUDGET.forEach(r => out.push(`- ${r[0]}：${r[1]}（${strip(r[2])}）`));
    out.push('- 合计：约 6,850 元（含备用金 2,300）');
    out.push('');
    out.push('## 实用速查');
    METRO.forEach(r => out.push(`- 地铁：${r[0]} → ${r[1]} ${r[2]}`));
    HOURS.forEach(r => out.push(`- ${r[0]}：${r[1]}｜闭馆 ${r[2]}`));
    PHONES.forEach(t => out.push(`- ${strip(t)}`));
    TOP3.forEach((t,i) => out.push(`${i+1}. ${strip(t)}`));
    out.push('');
  }
  out.push('---');
  out.push('*由手机版计划清单导出，勾选状态随当前进度*');
  return out.join('\n');
}
function openText(dayId){
  document.getElementById('sheetTextTitle').textContent = dayId ? '这天的清单' : '全部文字清单';
  const txt = buildText(dayId);
  document.getElementById('shareText').value = txt;
  show('sheetText');
}
document.getElementById('btnCopyText').onclick = async () => {
  const ta = document.getElementById('shareText');
  try { await navigator.clipboard.writeText(ta.value); toast('已复制到剪贴板'); }
  catch (e) {
    ta.removeAttribute('readonly'); ta.focus(); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (e2) { toast('请长按全选复制'); }
    ta.setAttribute('readonly','');
  }
};

  const d = DAYS.find(x => x.id === dayId);
  const rain = !!store[K.rain(d.id)];
  return `<div class="x-head">
      <div class="x-day">${d.no}</div>
      <div class="x-title">${d.date} ${d.week} · ${d.weather} ${d.temp}</div>
      <div class="x-theme">${d.theme}　|　${d.lead}<br>${d.traffic}<br>强度：${d.level||'轻'}　|　日落 17:02</div>
    </div>
    <div class="x-body">
      <table><thead><tr><th style="width:126px">时间</th><th>安排</th><th style="width:196px">交通</th><th style="width:286px">提示</th></tr></thead>
      <tbody>${d.rows.map(r => `<tr>
        <td class="x-time">${r[0]}</td>
        <td><b>${r[1]}</b>${rain && r[4] ? `<br><span style="font-size:24px;color:#2F5C72">☔ ${r[4]}</span>` : ''}</td>
        <td class="x-tr">${r[2] === '—' ? '' : r[2]}</td>
        <td class="x-tip">${r[3] === '—' ? '' : r[3]}</td>
      </tr>`).join('')}</tbody></table>
      <div class="x-map">${schematic(dayRoutes(d), 960, 430, 26)}</div>
      ${(d.notes||[]).map(n => n.list.map(t => `<div class="x-note">${t}</div>`).join('')).join('')}
      <div class="x-note"><b>可砍项</b>：${d.cut}</div>
      ${d.pick ? `<div class="x-note"><b>下午空档三选一</b>：${store[K.pick(d.id)]!=null && d.pick[+store[K.pick(d.id)]] ? '已选 '+d.pick[+store[K.pick(d.id)]].t : '待定'}（${d.pick.map(p=>p.t).join(' / ')}）</div>` : ''}
      ${rain ? `<div class="x-rain"><b>☔ ${RAIN_KIND[d.rainKind]||'雨天版'}</b>：${d.rainNote}</div>` : ''}
      <div class="x-foot">南京亲子五日游 · 2026.11.28–12.02 · 两大一小</div>
    </div>`;
}
async function exportDay(dayId){
  if (!window.html2canvas){ toast('截图库未加载'); return; }
  const d = DAYS.find(x => x.id === dayId);
  toast('正在生成图片…');
  const root = document.getElementById('exportRoot');
  root.innerHTML = buildExport(dayId);
  try {
    const h = root.scrollHeight;
    const canvas = await html2canvas(root, { scale:1, backgroundColor:'#FFFDF9', logging:false, width:1080, height:h });
    const a = document.createElement('a');
    a.download = `南京${d.no.replace(' ','')}-${d.date.replace('/','-')}-行程.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('图片已生成，去相册 / 下载里查看');
  } catch (e) {
    console.error(e); toast('生成失败：' + e.message);
  } finally { root.innerHTML = ''; }
}

/* =====================================================================
   GCJ-02 纠偏（高德底图用 GCJ-02，点位是 WGS-84）
   ===================================================================== */
function outOfChina(lat, lng){ return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function wgs2gcj(lat, lng){
  if (outOfChina(lat, lng)) return [lat, lng];
  const a = 6378245.0, ee = 0.00669342162296594323;
  const dLat = (x, y) => {
    let r = -100 + 2*x + 3*y + .2*y*y + .1*x*y + .2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
    r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
    return r;
  };
  const dLng = (x, y) => {
    let r = 300 + x + 2*y + .1*x*x + .1*x*y + .1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
    r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
    return r;
  };
  const radLat = lat/180*Math.PI;
  let magic = Math.sin(radLat); magic = 1 - ee*magic*magic;
  const sq = Math.sqrt(magic);
  return [lat + (dLat(lng-105, lat-35)*180)/((a*(1-ee))/(magic*sq)*Math.PI),
          lng + (dLng(lng-105, lat-35)*180)/(a/sq*Math.cos(radLat)*Math.PI)];
}
